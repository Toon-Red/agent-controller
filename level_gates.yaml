# Per-transition gate + principle enforcement (d15de2b4 AC-PRINCIPLES1).
#
# Each transition lists `gates` (the 5 frozen predicates from 3f83494b)
# and `principles` (the 6 Amazon-LP predicates from d15de2b4). The
# enforcer in scripts/level_gate_enforcer.py runs both lists; ANY
# failure raises LevelGateViolation with all failing names.
#
# Stacked semantics: every entry must pass for the transition to
# proceed. Principles can be added or removed per transition by
# editing this file -- no code change required (PRINCIPLE_REGISTRY
# resolves names at lookup time).
#
# Per the d15de2b4 honest-stop: principle_gates_passed is wired only
# to transitions where the L7 dispatch can hydrate `task_id` +
# `project_id` from PD. L4->L5 omits it because L4 records are local
# to the swarm member and may not be in PD yet.
transitions:
  L4_to_L5:
    gates: [gate_l4_to_l5__tests_run]
    principles:
      - principle_owner_declared
      - principle_data_cited
      - principle_no_indefinite_stall
  L5_to_L6:
    gates: [gate_l5_to_l6__quality_review]
    principles:
      - principle_owner_declared
      - principle_gates_passed
      - principle_no_indefinite_stall
  L6_to_L7:
    gates: [gate_l6_to_l7__swarm_complete]
    principles:
      - principle_owner_declared
      - principle_gates_passed
  L7_to_L8:
    gates: [gate_l7_to_l8__green_ci]
    principles:
      - principle_customer_cited
      - principle_owner_declared
      - principle_cost_evaluated
      - principle_gates_passed
  L8_to_Preston:
    gates: [gate_l8_to_preston__decision_needed]
    principles:
      - principle_customer_cited
      - principle_data_cited
      - principle_cost_evaluated

# ---------------------------------------------------------------------------
# 97346fa1 AC-AGENT-ENV1: per-role tool requirements
# ---------------------------------------------------------------------------
# Key shape: "<role>-<level>" or "<role>-<level>-<task.category>".
# Resolved by scripts.l_prompt.prompt_tool_allowlist_covers_task in
# this order: exact (role+level+category), generic (role+level), then
# fail-closed if no match. Don't silently pass an unverified role.
#
# Rules:
#   must_have_all_of:        every tool name listed MUST appear in prompt.tools_block.
#   must_have_at_least_one_of: at least one tool name from the list MUST appear.
# Combine both keys when a role needs both unconditional + alternatives
# (e.g. coder-l4-bug-fix demands read_file + run_tests AND at least one of
# edit_file/write_file).
tool_requirements:
  coder-L4-bug:
    must_have_all_of: [read_file, run_tests]
    must_have_at_least_one_of: [edit_file, write_file]
  coder-L4-feature:
    must_have_all_of: [read_file, edit_file, run_tests]
  coder-L4:
    must_have_all_of: [read_file, run_tests]
    must_have_at_least_one_of: [edit_file, write_file]
  qa-L4:
    must_have_all_of: [read_file, run_tests]
  playtester-L4:
    must_have_at_least_one_of: [screenshot, browser_navigate, browser_open]
  grader-L4:
    must_have_all_of: [read_file, list_files]
  manager-L5:
    must_have_all_of: [read_pd_task, update_pd_task]
  queen-L6:
    must_have_all_of: [spawn_agent, agent_status]
  dispatch-L7:
    must_have_all_of: [list_pd_tasks, read_pd_task, send_l7_dispatch]
